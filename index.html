<style>
:root{--bg:#f3f6ea;--c:#fff;--t:#2b2f26;--m:#6e7566;--p:#86b32e;--p2:#a9cd4f;--pd:#5a7e18;--soft:#eaf3d2;--b:#e2e8d4;--x:#e8590c;--sh:0 6px 24px rgba(76,100,24,.10)}
@media(prefers-color-scheme:dark){:root{--bg:#12150d;--c:#1b2014;--t:#eef2e4;--m:#9aa38a;--b:#2c3322;--soft:#26301a;--sh:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:17px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;background:linear-gradient(180deg,var(--soft) 0,var(--bg) 320px) no-repeat var(--bg);color:var(--t);padding-bottom:104px}
header{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--c);box-shadow:var(--sh);position:sticky;top:0;z-index:5;border-bottom:3px solid var(--p)}
header img{height:58px;margin-right:auto}header b{display:none}
main{padding:16px;max-width:900px;margin:auto}
.card{background:var(--c);border-radius:24px;padding:20px;margin-bottom:16px;box-shadow:var(--sh);border:1px solid var(--b)}
input,select,button,textarea{font:inherit;padding:14px 16px;border-radius:16px;border:1.5px solid var(--b);background:var(--c);color:var(--t);min-height:56px;max-width:100%}
input:focus,select:focus{outline:0;border-color:var(--p);box-shadow:0 0 0 4px rgba(134,179,46,.22)}
button{background:linear-gradient(135deg,var(--p2),var(--p));color:#fff;border:0;font-weight:700;box-shadow:0 4px 14px rgba(110,150,30,.3)}
button.g{background:var(--soft);color:var(--pd);box-shadow:none}button.r{background:#c0392b;box-shadow:none}
label{display:block;font-size:13px;font-weight:600;color:var(--m);margin:12px 0 4px}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:110px}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;gap:4px;background:var(--c);border-radius:30px;padding:6px;box-shadow:0 8px 30px rgba(40,60,10,.22);border:1px solid var(--b);z-index:9}
nav button{flex:1;background:none;color:var(--m);box-shadow:none;border-radius:24px;font-size:12px;font-weight:600;min-height:66px;padding:6px 2px}nav button.on{background:var(--soft);color:var(--pd)}
.ic{display:block;font-size:30px;line-height:1.15}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0}.tile{background:var(--c);color:var(--t);border:2px solid var(--b);box-shadow:none;min-height:98px;font-size:14px;font-weight:600;border-radius:20px}.tile.on{border-color:var(--p);background:var(--soft);color:var(--pd)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.cal div{min-height:68px;border-radius:14px;padding:4px 2px;font-size:13px;text-align:center;background:var(--bg)}.cal .h{min-height:0;background:none;color:var(--m);font-weight:600}
.W{background:#e3f0c4!important}.V{background:#d6e8fb!important}.K{background:#fde0c4!important}.F{background:#e7d9f5!important}.Z{background:#d3efe8!important}.X{box-shadow:inset 0 0 0 2px var(--x)}
@media(prefers-color-scheme:dark){.W,.V,.K,.F,.Z{color:#111}}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{border-bottom:1px solid var(--b);padding:8px 6px;text-align:left}th{color:var(--m);font-size:12px;text-transform:uppercase}.sc{overflow-x:auto}
h3{margin:4px 0 10px;font-size:20px}small{color:var(--m)}.big{text-align:center;padding-top:28px}.big img{width:82%;max-width:320px;margin-bottom:8px}
.ib{min-width:58px;font-size:26px;padding:6px;flex:none}#pr{display:none}
.lgd{display:none}@media(prefers-color-scheme:dark){.lgl{display:none}.lgd{display:inline}}
header img{height:64px}.big img{width:88%;max-width:360px;height:auto}
.nv{display:grid;grid-template-columns:62px 1fr 62px;gap:8px;margin-bottom:8px}.nv2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.nv select,.nv2 select{width:100%}
.xx{color:var(--x);font-weight:700}.cal small.xx{font-size:12px}
.lgd2{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--m);margin:12px 0 0}.lgd2 i{display:inline-block;width:14px;height:14px;border-radius:5px;margin-right:5px;vertical-align:-2px}.lgd2 .X{background:none!important}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--t);color:var(--bg);padding:12px 22px;border-radius:999px;z-index:30;font-weight:700}
.imp{display:inline-flex!important;align-items:center;min-height:56px;padding:0 18px;border-radius:16px;background:var(--soft);color:var(--pd)!important;font-size:17px!important;font-weight:700;margin:0!important}
</style></head><body><div id="app"></div><div id="pr"></div>

function xl(p){let r='',tot=0;for(let d=1;d<=dim(Y,M);d++){const c=day(p,Y,M,d);if(c.ex>0){tot+=c.ex;r+='<tr><td>'+pad(d)+'.'+pad(M+1)+'</td><td>'+hm(c.wk)+'</td><td>'+hm(c.r)+'</td><td class="xx">+'+hm(c.ex)+'</td><td>'+(d>20?'→':'')+'</td></tr>'}}return r?'<h3 style="margin-top:16px">'+t('ex')+'</h3><table><tr><th>'+t('day')+'</th><th>'+t('tot')+'</th><th>'+t('rg')+'</th><th>'+t('ex')+'</th><th></th></tr>'+r+'<tr><td><b>'+t('tot')+'</b></td><td></td><td></td><td class="xx"><b>+'+hm(tot)+'</b></td><td></td></tr></table><small>→ '+t('nxm')+'</small>':''}
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
const ERR=c=>({closed:t('locked'),needg:t('needg'),dup_name:t('dup'),dup_pw:t('dup'),chk:t('chk'),perm:'Sem permissão',auth:'Sessão expirada. Entre outra vez.',net:'Sem ligação / Keine Verbindung',exists:'Já existe um Gestor'})[c]||String(c);
async function rpc(fn,a){try{const r=await fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY},body:JSON.stringify(a||{})});const j=await r.json();return r.ok?j:{error:(j&&j.message)||'err'}}catch(e){return{error:'net'}}}
const snap=()=>{B=JSON.parse(JSON.stringify({people:S.people,data:S.data,closed:S.closed,vm:S.vm,vn:S.vn,ver:S.ver,conf:S.conf}))};
function sv(){Q=Q.then(sync).catch(()=>{})}
async function load(){const r=await rpc('pp_api',{p_tok:TOK,p_act:'state',p_d:{}});if(!r||r.error){if(r&&r.error=='net')S.err=1;else if(r&&r.error=='auth'){TOK='';localStorage.ppt='';me=null}return false}
ME=r.me;S.people=r.people.map(p=>({id:p.id,name:p.name,role:p.role,exp:p.exp,vac:p.vac,start:p.start||'',on:p.active}));S.data=r.days||{};S.closed={};S.vm={};S.vn={};S.ver={};S.conf={};for(const k in(r.meta||{})){const i=k.indexOf(':');S[k.slice(0,i)][k.slice(i+1)]=r.meta[k]}S.log=r.log||[];me=S.people.find(p=>p.id==ME)||null;snap();S.err=0;return true}
async function sync(){if(!TOK||!B||!me)return;const J=JSON.stringify,ops=[];
for(const pid in S.data)for(const day in S.data[pid]){if(J(S.data[pid][day])!==J((B.data[pid]||{})[day]||[]))ops.push(['setday',{person:pid,day,items:S.data[pid][day]}])}
for(const ty of['closed','vm','vn','ver','conf'])for(const k in S[ty])if(J(S[ty][k])!==J(B[ty][k]))ops.push(['meta',{k:ty+':'+k,v:S[ty][k]}]);
for(const p of S.people){const o=B.people.find(x=>x.id==p.id);if(!o)continue;const f={};for(const k of['name','exp','vac','start','on','role'])if(J(p[k])!==J(o[k]))f[k=='on'?'active':k]=p[k];if(Object.keys(f).length)ops.push(['upd',{person:p.id,f}])}
if(!ops.length)return;SYN=true;let bad=null;for(const[a,d]of ops){const r=await rpc('pp_api',{p_tok:TOK,p_act:a,p_d:d});if(r.error){bad=r.error;break}}SYN=false;
if(bad&&bad!='net')alert(ERR(bad));const ok=await load();if(!ok&&bad=='net')S.err=1;R()}
async function out(){await rpc('pp_api',{p_tok:TOK,p_act:'logout',p_d:{}});TOK='';localStorage.ppt='';me=null;S.people=[];S.data={};B=null;R()}
async function boot(){if(TOK)await load();if(!me){const i=await rpc('pp_init',{});NEED=!!(i&&i.setup)}LOAD=false;if(me)vid=ME;R()}
function pick(x){$('#ty').value=x;document.querySelectorAll('.tile').forEach(b=>b.classList.toggle('on',b.dataset.x==x));$('#w').style.display=x=='W'?'block':'none'}
function rn(id){const v=prompt(t('name'),P(id).name);if(v&&v.trim()){P(id).name=v.trim();lg('ren');sv();R()}}
boot();setInterval(()=>{if(TOK&&me&&!SYN){if(S.err)sv();else if(['team','cal','sum'].includes(tab)&&document.visibilityState=='visible')load().then(ok=>ok&&R())}},45000);addEventListener('online',()=>sv());
</script></body></html>
